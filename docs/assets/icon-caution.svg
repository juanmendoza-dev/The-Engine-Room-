  <rect x="0.5" y="0.5" width="39" height="39" fill="none" stroke="#16151a" stroke-opacity="0.25" stroke-width="1"/>
  <g stroke="#e0331f" stroke-width="2" fill="none">
    <line x1="28" y1="1" x2="39" y2="1"/>
    <line x1="39" y1="1" x2="39" y2="12"/>
  </g>
  <rect x="18" y="8" width="4" height="16" fill="#e0331f"/>
  <rect x="18" y="28" width="4" height="4" fill="#e0331f"/>
</svg>
