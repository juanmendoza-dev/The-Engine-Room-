<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="'Spline Sans Mono','Cascadia Mono',Consolas,monospace">
  <style>
    .box { fill: none; stroke: rgba(22,21,26,.5); stroke-width: 1.5; }
    .lbl { font-size: 12px; letter-spacing: 1px; fill: #16151a; text-anchor: middle; }
    .sub { font-size: 9px; letter-spacing: 2px; fill: rgba(22,21,26,.55); text-anchor: middle; }
    .wire { fill: none; stroke: rgba(22,21,26,.3); stroke-width: 1.5; stroke-dasharray: 4 4;
            animation: belt .5s linear infinite; }
    @keyframes belt { to { stroke-dashoffset: -8; } }
    .hl { fill: none; stroke: #e0331f; stroke-width: 1.5; }
    .h0 { animation: h0 4.8s linear infinite; } .h1 { animation: h1 4.8s linear infinite; }
    .h2 { animation: h2 4.8s linear infinite; } .h3 { animation: h3 4.8s linear infinite; }
    @keyframes h0 { 0%,2% { opacity: 0; } 6%,20% { opacity: 1; } 26%,100% { opacity: 0; } }
    @keyframes h1 { 0%,27% { opacity: 0; } 31%,45% { opacity: 1; } 51%,100% { opacity: 0; } }
    @keyframes h2 { 0%,52% { opacity: 0; } 56%,70% { opacity: 1; } 76%,100% { opacity: 0; } }
    @keyframes h3 { 0%,77% { opacity: 0; } 81%,95% { opacity: 1; } 99%,100% { opacity: 0; } }
  </style>
  <rect width="800" height="370" fill="#f2f0ea"/>
  <path class="wire" d="M180,54 L370,110"/>
  <path class="wire" d="M620,54 L430,110"/>
  <path class="wire" d="M370,146 L190,210"/>
  <path class="wire" d="M430,146 L610,210"/>
  <path class="wire" d="M190,246 L370,310"/>
  <path class="wire" d="M610,246 L430,310"/>
  <rect class="box" x="90" y="20" width="180" height="34"/><text class="lbl" x="180" y="41">/model-1v1</text>
  <rect class="box" x="530" y="20" width="180" height="34"/><text class="lbl" x="620" y="41">/user-1v1</text>
  <rect class="box" x="280" y="110" width="240" height="36"/><text class="lbl" x="400" y="132">getMoveFor(fen, config)</text>
  <rect class="box" x="90" y="210" width="200" height="36"/><text class="lbl" x="190" y="228">engineStockfish</text><text class="sub" x="190" y="240">WEB WORKER · UCI</text>
  <rect class="box" x="510" y="210" width="200" height="36"/><text class="lbl" x="610" y="228">engineMaia</text><text class="sub" x="610" y="240">ONNXRUNTIME-WEB</text>
  <rect class="box" x="300" y="310" width="200" height="36"/><text class="lbl" x="400" y="328">chess.js</text><text class="sub" x="400" y="340">SOLE AUTHORITY</text>
  <!-- red sequence highlights -->
  <g>
    <rect class="hl h0" x="90" y="20" width="180" height="34"/>
    <rect class="hl h0" x="530" y="20" width="180" height="34"/>
    <rect class="hl h1" x="280" y="110" width="240" height="36"/>
    <rect class="hl h2" x="90" y="210" width="200" height="36"/>
    <rect class="hl h2" x="510" y="210" width="200" height="36"/>
    <rect class="hl h3" x="300" y="310" width="200" height="36"/>
  </g>
</svg>
