<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" font-family="'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',serif">
  <style>
    .loop { animation: fadeloop 12s linear infinite; }
    @keyframes fadeloop { 0% { opacity: 0; } 2% { opacity: 1; } 96% { opacity: 1; } 98% { opacity: 0; } 100% { opacity: 0; } }
    .mv { animation-duration: 12s; animation-timing-function: cubic-bezier(.3,.7,.3,1); animation-iteration-count: infinite; }
    .m1 { animation-name: m1; } .m2 { animation-name: m2; } .m3 { animation-name: m3; }
    .m4 { animation-name: m4; } .m5 { animation-name: m5; } .m6 { animation-name: m6; }
    @keyframes m1 { 0%,8% { transform: translate(0,0); } 10.5%,97% { transform: translate(0,-60px); } 98.5%,100% { transform: translate(0,0); } }
    @keyframes m2 { 0%,20% { transform: translate(0,0); } 22.5%,97% { transform: translate(0,60px); } 98.5%,100% { transform: translate(0,0); } }
    @keyframes m3 { 0%,32% { transform: translate(0,0); } 34.5%,97% { transform: translate(-30px,-60px); } 98.5%,100% { transform: translate(0,0); } }
    @keyframes m4 { 0%,44% { transform: translate(0,0); } 46.5%,97% { transform: translate(0,30px); } 98.5%,100% { transform: translate(0,0); } }
    @keyframes m5 { 0%,56% { transform: translate(0,0); } 58.5%,97% { transform: translate(0,-60px); } 98.5%,100% { transform: translate(0,0); } }
    @keyframes m6 { 0%,68% { transform: translate(0,0); } 70.5%,97% { transform: translate(120px,120px); } 98.5%,100% { transform: translate(0,0); } }
    .last { animation: last 12s step-end infinite; }
    @keyframes last {
      0% { opacity: 0; transform: translate(0,0); }
      10.5% { opacity: 1; transform: translate(0,0); }
      22.5% { transform: translate(0,-30px); }
      34.5% { transform: translate(30px,30px); }
      46.5% { transform: translate(-30px,-60px); }
      58.5% { transform: translate(-30px,0); }
      70.5% { transform: translate(60px,0); }
      96% { opacity: 1; } 97% { opacity: 0; } 100% { opacity: 0; }
    }
    .p { font-size: 24px; text-anchor: middle; fill: #16151a; }
    .mono { font-family: 'Spline Sans Mono','Cascadia Mono',Consolas,monospace; }
  </style>
  <rect width="320" height="330" fill="#f2f0ea"/>
  <pattern id="checker" patternUnits="userSpaceOnUse" x="40" y="20" width="60" height="60">
    <rect width="60" height="60" fill="#e9e6dd"/>
    <rect x="30" y="0" width="30" height="30" fill="#dcd8cb"/>
    <rect x="0" y="30" width="30" height="30" fill="#dcd8cb"/>
  </pattern>
  <rect x="40" y="20" width="240" height="240" fill="url(#checker)"/>
  <rect x="38.5" y="18.5" width="243" height="243" fill="none" stroke="#16151a" stroke-width="1.5"/>
  <g class="loop">
    <rect class="last" x="160" y="140" width="30" height="30" fill="rgba(224,51,31,.16)" stroke="#e0331f" stroke-width="1.25"/>
    <!-- black back rank -->
    <text class="p" x="55" y="42">&#9820;</text><text class="p" x="85" y="42">&#9822;</text>
    <text class="p mv m6" x="115" y="42">&#9821;</text>
    <text class="p" x="145" y="42">&#9819;</text><text class="p" x="175" y="42">&#9818;</text>
    <text class="p" x="205" y="42">&#9821;</text><text class="p" x="235" y="42">&#9822;</text><text class="p" x="265" y="42">&#9820;</text>
    <!-- black pawns -->
    <text class="p" x="55" y="72">&#9823;</text><text class="p" x="85" y="72">&#9823;</text><text class="p" x="115" y="72">&#9823;</text>
    <text class="p mv m4" x="145" y="72">&#9823;</text>
    <text class="p mv m2" x="175" y="72">&#9823;</text>
    <text class="p" x="205" y="72">&#9823;</text><text class="p" x="235" y="72">&#9823;</text><text class="p" x="265" y="72">&#9823;</text>
    <!-- white pawns -->
    <text class="p" x="55" y="222">&#9817;</text><text class="p" x="85" y="222">&#9817;</text><text class="p" x="115" y="222">&#9817;</text>
    <text class="p mv m5" x="145" y="222">&#9817;</text>
    <text class="p mv m1" x="175" y="222">&#9817;</text>
    <text class="p" x="205" y="222">&#9817;</text><text class="p" x="235" y="222">&#9817;</text><text class="p" x="265" y="222">&#9817;</text>
    <!-- white back rank -->
    <text class="p" x="55" y="252">&#9814;</text><text class="p" x="85" y="252">&#9816;</text><text class="p" x="115" y="252">&#9815;</text>
    <text class="p" x="145" y="252">&#9813;</text><text class="p" x="175" y="252">&#9812;</text><text class="p" x="205" y="252">&#9815;</text>
    <text class="p mv m3" x="235" y="252">&#9816;</text>
    <text class="p" x="265" y="252">&#9814;</text>
  </g>
  <text class="mono" x="160" y="290" font-size="9" letter-spacing="1" fill="rgba(22,21,26,.6)" text-anchor="middle">1. e4 e5  2. Nf3 d6  3. d4 Bg4</text>
  <text class="mono" x="160" y="308" font-size="9" letter-spacing="2.5" fill="#16151a" text-anchor="middle">THE OPERA GAME · PARIS 1858 <tspan fill="#e0331f">▪</tspan></text>
</svg>
