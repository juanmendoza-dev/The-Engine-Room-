<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Archivo Black','Arial Black',sans-serif">
  <style>
    .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) both; }
    .l1 { animation-delay: .1s; } .l2 { animation-delay: .28s; } .l3 { animation-delay: .46s; }
    @keyframes rise { from { transform: translateY(95px); } to { transform: translateY(0); } }
    .fadein { opacity: 0; animation: fin .7s ease-out forwards; }
    .k { animation-delay: 1.05s; } .tick { animation-delay: 1.3s; }
    @keyframes fin { to { opacity: 1; } }
    .line { fill: #16151a; font-size: 88px; letter-spacing: -3px; }
    .hollow { fill: none; stroke: #16151a; stroke-width: 2.5; }
    .mono { font-family: 'Spline Sans Mono','Cascadia Mono',Consolas,monospace; font-weight: 400; }
  </style>
  <rect width="800" height="320" fill="#f2f0ea"/>
  <clipPath id="c1"><rect x="0" y="34" width="800" height="90"/></clipPath>
  <clipPath id="c2"><rect x="0" y="118" width="800" height="90"/></clipPath>
  <clipPath id="c3"><rect x="0" y="202" width="800" height="90"/></clipPath>
  <g clip-path="url(#c1)"><text class="line rise l1" x="40" y="112">THE</text></g>
  <g clip-path="url(#c2)"><text class="line hollow rise l2" x="40" y="196">ENGINE</text></g>
  <g clip-path="url(#c3)"><text class="line rise l3" x="40" y="280">ROOM</text></g>
  <rect class="fadein tick" x="774" y="18" width="9" height="9" fill="#e0331f"/>
  <text class="mono fadein k" x="42" y="308" font-size="10" letter-spacing="3.5" fill="rgba(22,21,26,.6)">TWO ENGINES · NO BACKEND · THE BOARD IS THE LAW</text>
</svg>
