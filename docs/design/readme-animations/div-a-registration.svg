<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24">
  <style>
    .rl { transform-box: fill-box; transform-origin: left center; animation: draw .8s cubic-bezier(.16,1,.3,1) both; }
    .rr { transform-box: fill-box; transform-origin: right center; animation: draw .8s cubic-bezier(.16,1,.3,1) both; }
    @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .tick { transform-box: fill-box; transform-origin: center; animation: tick .5s cubic-bezier(.16,1,.3,1) .55s both; }
    @keyframes tick { from { transform: rotate(135deg) scale(0); } to { transform: rotate(0deg) scale(1); } }
  </style>
  <rect width="800" height="24" fill="#f2f0ea"/>
  <rect class="rr" x="0" y="11" width="386" height="1.5" fill="rgba(22,21,26,.6)"/>
  <rect class="rl" x="414" y="11" width="386" height="1.5" fill="rgba(22,21,26,.6)"/>
  <rect class="tick" x="396.5" y="8.5" width="7" height="7" fill="#e0331f"/>
</svg>
