  <text class="p" x="235" y="72">&#9823;</text><text class="p" x="265" y="72">&#9823;</text>
  <!-- rank 6 -->
  <text class="p" x="175" y="102">&#9819;</text>
  <!-- rank 5 -->
  <text class="p" x="175" y="132">&#9823;</text><text class="p" x="235" y="132">&#9815;</text>
  <!-- rank 4 -->
  <text class="p" x="175" y="162">&#9817;</text>
  <!-- rank 2 -->
  <text class="p" x="55" y="222">&#9817;</text><text class="p" x="85" y="222">&#9817;</text><text class="p" x="115" y="222">&#9817;</text>
  <text class="p" x="205" y="222">&#9817;</text><text class="p" x="235" y="222">&#9817;</text><text class="p" x="265" y="222">&#9817;</text>
